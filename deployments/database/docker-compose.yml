version: "3.9"

services:
  mariadb:
    container_name: golabs-mariadb
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${MARIADB_PORT}:3306"
    volumes:
      - ./volumes/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MARIADB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - golabs-db-net

networks:
  golabs-db-net:
    driver: bridge
